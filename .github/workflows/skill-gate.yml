name: "Supply-Chain Safety: Simple SkillSpector Gate"

"on":
  push:
    branches:
      - main
      - "test/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_skill:
        description: "Skill folder to scan"
        required: true
        default: "clean_skill"
        type: choice
        options:
          - clean_skill
          - toxic_skill

jobs:
  verify-skills:
    name: "NVIDIA SkillSpector Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: "Install NVIDIA SkillSpector"
        run: |
          uv tool install git+https://github.com/NVIDIA/skillspector.git
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: "Verify Clean Skill (PASS)"
        if: |
          (github.event_name == 'push' && !contains(github.ref_name, 'toxic')) ||
          (github.event_name == 'workflow_dispatch' && inputs.target_skill == 'clean_skill') ||
          (github.event_name == 'pull_request' && !contains(github.event.pull_request.title, 'toxic'))
        run: python3 verify_skill.py ./skills/clean_skill

      - name: "Verify Toxic Skill (FAIL / BLOCKED)"
        if: |
          (github.event_name == 'push' && contains(github.ref_name, 'toxic')) ||
          (github.event_name == 'workflow_dispatch' && inputs.target_skill == 'toxic_skill') ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'toxic'))
        run: python3 verify_skill.py ./skills/toxic_skill
